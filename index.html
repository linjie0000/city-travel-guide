<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>城市文旅查询助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563EB;
            --primary-light: #DBEAFE;
            --accent: #F59E0B;
            --accent-light: #FEF3C7;
            --green: #10B981;
            --green-light: #D1FAE5;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-secondary: #64748B;
            --text-light: #94A3B8;
            --border: #E2E8F0;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-text-size-adjust: 100%;
        }

        /* ============ Header ============ */
        header {
            background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
            color: white;
            padding: 36px 20px 72px;
            text-align: center;
        }
        header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: 1px; }
        header p { font-size: 13px; opacity: 0.85; }

        /* ============ Search ============ */
        .search-container {
            max-width: 560px;
            margin: -48px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }
        .search-box {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 6px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .search-box input {
            flex: 1; border: none; outline: none;
            padding: 12px 14px; font-size: 16px;
            background: transparent; color: var(--text);
            min-width: 0;
        }
        .search-box input::placeholder { color: var(--text-light); }
        .search-box button {
            background: var(--primary); color: white; border: none;
            border-radius: var(--radius-sm); padding: 10px 20px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }
        .search-box button:hover { background: #1D4ED8; }
        .search-box button:active { transform: scale(0.97); }

        .quick-cities { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
        .quick-cities button {
            background: rgba(255, 255, 255, 0.9); border: none;
            border-radius: 20px; padding: 5px 14px; font-size: 12px;
            color: var(--primary); cursor: pointer; transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .quick-cities button:hover, .quick-cities button:active { background: white; box-shadow: var(--shadow); }

        /* ============ Main ============ */
        main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }

        /* ============ Loading ============ */
        .loading { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%; margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============ Section Title ============ */
        .section-title {
            font-size: 18px; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        /* ============ Weather Card ============ */
        .weather-card {
            background: var(--card); border-radius: var(--radius);
            box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 16px; position: relative; overflow: hidden;
        }
        .weather-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .weather-main { display: flex; align-items: center; gap: 16px; }
        .weather-icon { font-size: 52px; line-height: 1; }
        .weather-temp { display: flex; flex-direction: column; }
        .weather-temp .temp { font-size: 40px; font-weight: 700; color: var(--text); line-height: 1.1; }
        .weather-temp .desc { font-size: 14px; color: var(--text-secondary); }

        .weather-details {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 8px; flex: 1; max-width: 400px;
        }
        .weather-detail-item { text-align: center; padding: 10px 6px; background: var(--bg); border-radius: var(--radius-sm); }
        .weather-detail-item .label { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
        .weather-detail-item .value { font-size: 14px; font-weight: 600; color: var(--text); }

        /* ============ Content Grid ============ */
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .content-section h2 {
            font-size: 16px; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
        }

        /* ============ Item Card ============ */
        .item-card {
            background: var(--card); border-radius: var(--radius-sm);
            box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px;
            transition: all 0.2s; border-left: 3px solid transparent;
            position: relative;
        }
        .item-card:hover { box-shadow: var(--shadow-lg); transform: translateX(4px); }

        .item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

        .search-links { display: flex; gap: 6px; flex-shrink: 0; }
        .search-btn {
            font-size: 11px; font-weight: 600; text-decoration: none;
            padding: 5px 10px; border-radius: 6px; border: none; cursor: pointer;
            transition: all 0.2s; white-space: nowrap; display: inline-flex;
            align-items: center; gap: 3px;
            -webkit-tap-highlight-color: transparent;
        }
        .search-btn.xhs { background: #FFF0F2; color: #FF2442; }
        .search-btn.xhs:hover { background: #FF2442; color: white; }
        .search-btn.dy { background: #F3F3F3; color: #161823; }
        .search-btn.dy:hover { background: #161823; color: white; }
        .content-section:nth-child(1) .item-card { border-left-color: var(--accent); }
        .content-section:nth-child(2) .item-card { border-left-color: var(--green); }

        .item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
        .item-name-wrap { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
        .item-number {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--primary); color: white;
            font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .item-name { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-all; }
        .item-type-badge {
            font-size: 10px; padding: 1px 5px; border-radius: 4px;
            background: var(--accent-light); color: #92400E; white-space: nowrap; line-height: 1.4;
        }
        .item-type-badge.green { background: var(--green-light); color: #065F46; }

        .item-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; }
        .item-meta span { display: flex; align-items: center; gap: 2px; }

        .item-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
        .item-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .item-tag {
            font-size: 10px; padding: 1px 6px; border-radius: 10px;
            background: var(--primary-light); color: var(--primary);
        }
        .item-tag.green { background: var(--green-light); color: var(--green); }
        .item-tag.amber { background: var(--accent-light); color: #92400E; }

        /* ============ Error / Empty ============ */
        .error-msg, .empty-msg { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .error-msg { color: #EF4444; }

        .data-source { font-size: 10px; color: var(--text-light); margin-top: 2px; font-weight: 400; }

        /* ============ App Jump Toast ============ */
        .jump-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 13px; z-index: 9999;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            white-space: nowrap; max-width: 90vw; text-align: center;
        }
        .jump-toast.show { opacity: 1; }

        footer { text-align: center; padding: 20px; color: var(--text-light); font-size: 11px; }

        /* ============ Responsive ============ */
        @media (max-width: 700px) {
            header { padding: 28px 16px 60px; }
            header h1 { font-size: 20px; }
            .weather-card { padding: 16px; flex-direction: column; align-items: flex-start; }
            .weather-icon { font-size: 40px; }
            .weather-temp .temp { font-size: 32px; }
            .weather-details { max-width: 100%; width: 100%; }
            .content-grid { grid-template-columns: 1fr; gap: 16px; }
            .item-name { font-size: 13px; }
            .search-btn { font-size: 10px; padding: 4px 8px; }
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

        <h1>🏙️ 城市文旅查询助手</h1>
        <p>输入城市名称，一键查询天气、美食与景点</p>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="输入城市名称，如：广州、大理、赛里木湖..." autocomplete="off">
            <button id="searchBtn" onclick="handleSearch()">🔍 查询</button>
        </div>
        <div class="quick-cities" id="quickCities"></div>
    </div>

    <main id="result">
        <div class="empty-msg">
            <p style="font-size: 48px; margin-bottom: 16px;">🗺️</p>

        </div>

        function openSearch(platform, keyword) {
            const encoded = encodeURIComponent(keyword);

            // ============ 电脑端：直接新标签页打开网页搜索 ============
            if (!isMobile()) {
                const webUrl = platform === 'xhs'
                    ? `https://www.xiaohongshu.com/search_result?keyword=${encoded}&source=web_explore_feed`
                    : `https://www.douyin.com/search/${encoded}`;
                window.open(webUrl, '_blank', 'noopener');
                return;
            }

            // ============ 微信/QQ内：无法拉起APP，显示引导 ============
            if (isWechat() || /QQ\//i.test(navigator.userAgent)) {
                showWechatGuide();
                return;
            }

            // ============ 手机端浏览器 ============
            if (platform === 'xhs') {
                // 小红书：先尝试 Deep Link 拉起APP，2秒后回退到网页
                if (isIOS()) {
                    // iOS: 用 Universal Link（装了APP自动拉起，没装打开网页）
                    const universalLink = `https://www.xiaohongshu.com/search_result?keyword=${encoded}&source=web_explore_feed`;
                    showJumpToast('正在打开小红书...');
                    window.location.href = universalLink;
                    // 如果APP没装，Universal Link 会直接在浏览器打开网页版
                } else {
                    // Android: 先尝试 scheme 拉起APP
                    const appScheme = `xhsdiscover://search/result?keyword=${encoded}`;
                    const webFallback = `https://www.xiaohongshu.com/search_result?keyword=${encoded}&source=web_explore_feed`;
                    showJumpToast('正在打开小红书...');
                    const start = Date.now();
                    window.location.href = appScheme;
                    // 如果拉起失败（2秒内页面未隐藏），则跳网页版
                    setTimeout(() => {
                        if (Date.now() - start < 2500) {
                            window.open(webFallback, '_blank', 'noopener');
                        }
                    }, 2000);
                }
            } else {
                // 抖音
                if (isIOS()) {
                    // iOS: 抖音网页版会自动弹窗拉起APP
                    const webUrl = `https://www.douyin.com/search/${encoded}`;
                    showJumpToast('正在打开抖音...');
                    window.location.href = webUrl;
                } else {
                    // Android: 先尝试 scheme，回退到网页
                    const appScheme = `snssdk1128://search/detail?keyword=${encoded}`;
                    const webFallback = `https://www.douyin.com/search/${encoded}`;
                    showJumpToast('正在打开抖音...');
                    const start = Date.now();
                    window.location.href = appScheme;
                    setTimeout(() => {
                        if (Date.now() - start < 2500) {
                            window.open(webFallback, '_blank', 'noopener');
                        }
                    }, 2000);
                }
            }
        }

        async function geocodeCity(cityName) {
            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=zh&format=json`;
            const geoResp = await fetchWithTimeout(geoUrl, 8000);

            return geoData.results && geoData.results.length > 0 ? geoData.results[0] : null;
        }

        async function fetchWeatherByGeo(geoResult) {
            const { latitude, longitude, name, admin1, country } = geoResult;
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m&timezone=Asia/Shanghai`;
            const weatherResp = await fetchWithTimeout(weatherUrl, 8000);
            const weatherData = await weatherResp.json();
            const current = weatherData.current;
            const wmo = WMO_CODES[current.weather_code] || { text: "未知", emoji: "❓" };
            return {
                city: name, region: admin1, country: country,
                temperature: Math.round(current.temperature_2m),
                apparentTemp: Math.round(current.apparent_temperature),
                weatherCode: current.weather_code,
                weatherText: wmo.text, weatherEmoji: wmo.emoji,
                humidity: current.relative_humidity_2m,
                windSpeed: current.wind_speed_10m,
                windDir: windDirection(current.wind_direction_10m)
            };
        }

        async function fetchWeather(cityName) {
            const geoResult = await geocodeCity(cityName);
            if (geoResult) {
                try { return await fetchWeatherByGeo(geoResult); }
                catch (e) { console.warn('主天气请求失败:', e); }
            }
            const spot = getScenicSpot(cityName);
            if (spot) {
                try {
                    return await fetchWeatherByGeo({
                        latitude: spot.lat, longitude: spot.lon,
                        name: cityName, admin1: spot.region, country: '中国'
                    });
                } catch (e) { console.warn('景区天气请求失败:', e); }
            }
            const capital = getCapital(cityName);
            if (capital && capital !== cityName) {
                const capitalGeo = await geocodeCity(capital);
                if (capitalGeo) return await fetchWeatherByGeo(capitalGeo);
            }
            throw new Error('未找到该城市的地理位置');
        }

        const CORS_PROXIES = [

            'https://api.codetabs.com/v1/proxy?quest='
        ];

        async function fetchViaProxy(url, timeout) {
            for (const proxy of CORS_PROXIES) {
                try {
                    const fullUrl = proxy + encodeURIComponent(url);
                    const resp = await fetchWithTimeout(fullUrl, timeout || 10000);
                    if (!resp.ok) continue;
                    const text = await resp.text();
                    if (text && text.length > 200) return text;
                } catch (e) {
                    console.warn('CORS代理失败:', proxy, e.message);
                    continue;
                }
            }
            return null;
        }

        // 来源1: Wikipedia 中文 API（直接支持 CORS）
        async function scrapeWikiZh(cityName) {
            const results = { food: [], attractions: [] };
            try {
                const url = `https://zh.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(cityName)}`;
                const resp = await fetchWithTimeout(url, 6000);
                if (!resp.ok) return results;
                const data = await resp.json();
                const extract = data.extract || '';
                if (!extract) return results;
                // 从百科摘要中提取景点和美食关键词
                const attractionKeywords = ['公园','景区','博物馆','古迹','寺','塔','楼','阁','宫','院','陵','山','湖','河','海','湾','岛','桥','广场','祠','坛','园','殿','堡','城墙','古镇','故居','遗址','碑','观','堂'];
                const foodKeywords = ['菜','小吃','面','粉','饼','饺','糕','肉','鱼','汤','粥','鸭','鸡','火锅','烤','酿','馄饨','米线','豆花','糍粑','串','卤','酥','茶','酒'];
                // 提取包含关键词的句子
                const sentences = extract.split(/[。；！？]/).filter(s => s.trim().length > 4);
                for (const s of sentences) {
                    const hasFood = foodKeywords.some(k => s.includes(k));
                    const hasAttr = attractionKeywords.some(k => s.includes(k));
                    if (hasFood) {
                        // 尝试提取具体美食名
                        const names = s.match(/[\u4e00-\u9fa5]{2,8}(?:菜|面|粉|饼|饺|糕|肉|鱼|汤|粥|鸭|鸡|火锅|烤|酿|馄饨|米线|豆花|糍粑|串|卤|酥|茶|酒)/g);
                        if (names) {
                            for (const n of names) {
                                if (n.length >= 3 && n.length <= 10 && !results.food.some(f => f.name === n)) {
                                    results.food.push({ name: n, desc: s.trim().substring(0, 80), tags: ['百科'], cuisine: '' });
                                }
                            }
                        }
                    }
                    if (hasAttr) {
                        const names = s.match(/[\u4e00-\u9fa5]{2,10}(?:公园|景区|博物馆|古迹|寺|塔|楼|阁|宫|院|陵|广场|祠|坛|园|殿|堡|城墙|古镇|故居|遗址)/g);
                        if (names) {
                            for (const n of names) {
                                if (n.length >= 3 && n.length <= 12 && !results.attractions.some(a => a.name === n)) {
                                    results.attractions.push({ name: n, desc: s.trim().substring(0, 80), tags: ['百科'], type: '景点' });
                                }
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Wikipedia抓取失败:', e.message);
            }
            return results;
        }

        // 来源2: Bing搜索结果抓取
        async function scrapeBingSearch(cityName, type) {
            const results = [];
            const query = type === 'food' ? `${cityName} 美食推荐 必吃` : `${cityName} 景点推荐 必去`;
            const url = `https://www.bing.com/search?q=${encodeURIComponent(query)}&setlang=zh-Hans`;
            try {
                const html = await fetchViaProxy(url, 10000);
                if (!html) return results;
                // 解析Bing搜索结果 - 提取标题和摘要
                const liRegex = /<li class="b_algo"[^>]*>(.*?)<\/li>/gs;
                const matches = [];
                let m;
                while ((m = liRegex.exec(html)) !== null) {
                    matches.push(m[1]);
                }
                // 如果正则没匹配到，用更宽松的方式
                if (matches.length === 0) {
                    // 提取所有 <h2> 标题和对应的 <p> 摘要
                    const h2Regex = /<h2[^>]*>(.*?)<\/h2>/g;
                    const pRegex = /<p[^>]*>(.*?)<\/p>/g;
                    const titles = [];
                    const descs = [];
                    let hm;
                    while ((hm = h2Regex.exec(html)) !== null) {
                        const title = hm[1].replace(/<[^>]+>/g, '').trim();
                        if (title.length >= 2 && title.length <= 30) titles.push(title);
                    }
                    let pm;
                    while ((pm = pRegex.exec(html)) !== null) {
                        const desc = pm[1].replace(/<[^>]+>/g, '').trim();
                        if (desc.length >= 10 && desc.length <= 150) descs.push(desc);
                    }
                    for (let i = 0; i < Math.min(titles.length, 8); i++) {
                        const desc = descs[i] || '';
                        results.push({ title: titles[i], desc: desc });
                    }
                } else {
                    for (const match of matches) {
                        const titleMatch = match.match(/<a[^>]*>(.*?)<\/a>/);
                        const descMatch = match.match(/<p[^>]*>(.*?)<\/p>/);
                        if (titleMatch) {
                            const title = titleMatch[1].replace(/<[^>]+>/g, '').trim();
                            const desc = descMatch ? descMatch[1].replace(/<[^>]+>/g, '').trim() : '';
                            if (title.length >= 2 && title.length <= 40) {
                                results.push({ title, desc });
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn('Bing搜索抓取失败:', e.message);
            }
            return results;
        }

        // 来源3: DuckDuckGo搜索（HTML版，相对容易解析）
        async function scrapeDuckDuckGo(cityName, type) {
            const results = [];
            const query = type === 'food' ? `${cityName} 美食推荐` : `${cityName} 景点推荐`;
            const url = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
            try {
                const html = await fetchViaProxy(url, 10000);
                if (!html) return results;
                // DDG HTML结果格式: class="result__a" 标题, class="result__snippet" 摘要
                const resultRegex = /class="result__a"[^>]*>(.*?)<\/a>.*?(?:class="result__snippet"[^>]*>(.*?)<\/a>)?/gs;
                let m;
                while ((m = resultRegex.exec(html)) !== null) {
                    const title = m[1].replace(/<[^>]+>/g, '').trim();
                    const desc = (m[2] || '').replace(/<[^>]+>/g, '').trim();
                    if (title.length >= 2 && title.length <= 50) {
                        results.push({ title, desc });
                    }
                }
                // 兜底：宽松匹配
                if (results.length === 0) {
                    const linkRegex = /<a[^>]*class="result__a"[^>]*>(.*?)<\/a>/g;
                    let lm;
                    while ((lm = linkRegex.exec(html)) !== null) {
                        const title = lm[1].replace(/<[^>]+>/g, '').trim();
                        if (title.length >= 2 && title.length <= 50) {
                            results.push({ title, desc: '' });
                        }
                    }
                }
            } catch (e) {
                console.warn('DuckDuckGo抓取失败:', e.message);
            }
            return results;
        }

        // 来源4: Nominatim地理搜索 + Overpass详情查询（对任意城市自动获取bbox）
        async function autoBboxAndOverpass(cityName) {
            try {
                // 用 Nominatim 搜索城市获取 bbox
                const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cityName)}&format=json&limit=1&accept-language=zh`;
                const resp = await fetchWithTimeout(url, 6000);
                if (!resp.ok) return { food: [], attractions: [] };
                const data = await resp.json();
                if (!data || !data.length || !data[0].boundingbox) return { food: [], attractions: [] };
                const bb = data[0].boundingbox; // [south, north, west, east]
                const bbox = [parseFloat(bb[0]), parseFloat(bb[2]), parseFloat(bb[1]), parseFloat(bb[3])];
                // 用获取到的 bbox 查询 Overpass
                const [food, attractions] = await Promise.all([
                    fetchFromOverpass(bbox, 'food'),
                    fetchFromOverpass(bbox, 'attraction')
                ]);
                return {
                    food: food.slice(0, 5),
                    attractions: attractions.slice(0, 5),
                    source: 'OpenStreetMap'
                };
            } catch (e) {
                console.warn('Nominatim+Overpass自动查询失败:', e.message);
                return { food: [], attractions: [] };
            }
        }

        // 搜索结果解析：从标题和摘要中提取美食/景点
        function parseSearchResults(searchResults, cityName, type) {
            const items = [];
            const seen = new Set();
            // 常见分隔词
            const separators = ['、','，',',',' ','|','/','·','—','–'];
            // 过滤无关标题
            const stopPatterns = [/下载/, /安装/, /注册/, /登录/, /广告/, /官网/, /App/i, /appstore/i, /\d+条结果/, /为您找到/];

            for (const r of searchResults) {
                let text = r.title || '';
                // 去掉城市名前缀
                text = text.replace(new RegExp(cityName + '[\u4e00-\u9fa5]{0,2}(?:美食|景点|旅游|攻略|推荐)'), '');
                // 按|/—等分割，取有意义的部分
                let parts = [text];
                for (const sep of separators) {
                    if (text.includes(sep)) {
                        parts = text.split(sep);
                        break;
                    }
                }
                for (let part of parts) {
                    part = part.trim();
                    if (part.length < 2 || part.length > 15) continue;
                    if (stopPatterns.some(p => p.test(part))) continue;
                    // 美食关键词检测
                    const foodOk = type === 'food' && /菜|面|粉|饼|饺|糕|肉|鱼|汤|粥|鸭|鸡|锅|烤|串|卤|酥|茶|馄|米线|豆花|粑|糕|糕点|火锅|小吃|甜品|饮品|烧烤|海鲜/.test(part);
                    // 景点关键词检测
                    const attrOk = type === 'attraction' && /公园|景区|博物馆|古迹|寺|塔|楼|阁|宫|院|陵|山|湖|河|海|湾|岛|桥|广场|祠|坛|园|堡|城墙|古镇|故居|遗址|温泉|瀑布|峡谷|草原|沙漠|湿地|海滩/.test(part);
                    if (foodOk || attrOk) {
                        if (!seen.has(part)) {
                            seen.add(part);
                            const desc = r.desc ? r.desc.substring(0, 80) : '';
                            if (type === 'food') {
                                items.push({ name: part, desc: desc, tags: ['搜索'], cuisine: '' });
                            } else {
                                items.push({ name: part, desc: desc, tags: ['搜索'], type: '景点' });
                            }
                        }
                    }
                }
            }
            return items;
        }

        // 综合爬虫入口：当本地/Overpass数据不足时，自动触发
        async function scrapeFoodAndAttractions(cityName) {
            console.log('🔍 启动网络爬虫，抓取:', cityName);
            const foodResults = [];
            const attrResults = [];

            // 并行发起所有抓取请求
            const [wikiData, autoOverpass, bingFood, bingAttr, ddgFood, ddgAttr] = await Promise.all([
                scrapeWikiZh(cityName),
                autoBboxAndOverpass(cityName),
                scrapeBingSearch(cityName, 'food'),
                scrapeBingSearch(cityName, 'attraction'),
                scrapeDuckDuckGo(cityName, 'food'),
                scrapeDuckDuckGo(cityName, 'attraction')
            ]);

            // 合并Wikipedia结果
            if (wikiData.food.length) foodResults.push(...wikiData.food);
            if (wikiData.attractions.length) attrResults.push(...wikiData.attractions);

            // 合并自动Overpass结果
            if (autoOverpass.food.length) foodResults.push(...autoOverpass.food);
            if (autoOverpass.attractions.length) attrResults.push(...autoOverpass.attractions);

            // 合并Bing搜索结果
            const bingFoodItems = parseSearchResults(bingFood, cityName, 'food');
            const bingAttrItems = parseSearchResults(bingAttr, cityName, 'attraction');
            foodResults.push(...bingFoodItems);
            attrResults.push(...bingAttrItems);

            // 合并DuckDuckGo搜索结果
            const ddgFoodItems = parseSearchResults(ddgFood, cityName, 'food');
            const ddgAttrItems = parseSearchResults(ddgAttr, cityName, 'attraction');
            foodResults.push(...ddgFoodItems);
            attrResults.push(...ddgAttrItems);

            // 去重（按名称）
            const uniqueFood = dedupe(foodResults, 'name');
            const uniqueAttr = dedupe(attrResults, 'name');

            return {
                food: uniqueFood.slice(0, 5),
                attractions: uniqueAttr.slice(0, 5),
                source: '网络抓取'
            };
        }

        // 去重
        function dedupe(arr, key) {
            const seen = new Set();
            return arr.filter(item => {
                const k = item[key];
                if (seen.has(k)) return false;
                seen.add(k);
                return true;
            });
        }

        // ============================================================
        // Overpass API 增强：扩大搜索范围、多端点降级
        // ============================================================
        const OVERPASS_ENDPOINTS = [
            'https://overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter',
            'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
        ];

        async function overpassQuery(query) {
            // 尝试多个端点，依次降级
            for (const endpoint of OVERPASS_ENDPOINTS) {
                try {
                    const resp = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(query), 15000);
                    if (!resp.ok) continue;
                    const data = await resp.json();
                    if (data.elements && data.elements.length > 0) return data.elements;
                } catch (e) {
                    console.warn('Overpass端点失败:', endpoint, e.message);
                    continue;
                }
            }
            return [];
        }

        async function fetchFromOverpass(bbox, type) {
            const [south, west, north, east] = bbox;
            let query;
            if (type === 'food') {
                // 扩大搜索：增加 cafe、pub、food_court 等
                query = `[out:json][timeout:25];(node["amenity"~"restaurant|fast_food|cafe|pub|food_court|ice_cream"](${south},${west},${north},${east});way["amenity"~"restaurant|fast_food|cafe|pub|food_court|ice_cream"](${south},${west},${north},${east});node["shop"~"bakery|butcher|seafood|cheese|deli"](${south},${west},${north},${east}););out body center 30;`;
            } else {
                // 景点：增加 memorial、monastery、castle 等
                query = `[out:json][timeout:25];(node["tourism"~"attraction|museum|gallery|viewpoint|theme_park|zoo|aquarium|memorial|monastery|castle|ruins|yes"](${south},${west},${north},${east});way["tourism"~"attraction|museum|gallery|viewpoint|theme_park|zoo|aquarium|memorial|monastery|castle|ruins|yes"](${south},${west},${north},${east});node["historic"~"monument|castle|ruins|archaeological_site|heritage"](${south},${west},${north},${east});way["historic"~"monument|castle|ruins|archaeological_site|heritage"](${south},${west},${north},${east}););out body center 30;`;
            }

            const elements = await overpassQuery(query);
            const results = [];

            for (const e of elements) {
                const t = e.tags || {};
                if (Object.keys(t).length === 0) continue;
                const name = t.name || t['name:zh'] || t['name:en'];
                if (!name) continue;

                if (type === 'food') {
                    const cuisine = cuisineToZh(t.cuisine);
                    const addr = t['addr:street'] ? (t['addr:street'] + (t['addr:housenumber'] ? t['addr:housenumber'] + '号' : '')) : (t['addr:full'] || '');
                    const phone = t.phone || t['contact:phone'] || '';
                    const opening = t.opening_hours || '';
                    results.push({
                        name: name,
                        desc: [cuisine ? `菜系：${cuisine}` : '', addr ? `地址：${addr}` : '', phone ? `电话：${phone}` : '', opening ? `营业：${opening}` : ''].filter(Boolean).join(' · '),
                        tags: [cuisine ? cuisine : '餐厅', t.amenity === 'fast_food' ? '快餐' : t.amenity === 'cafe' ? '咖啡' : t.amenity === 'pub' ? '酒吧' : '正餐'].filter(v => v),
                        cuisine: cuisine,
                        addr: addr,
                        phone: phone
                    });
                } else {
                    const tourismType = TOURISM_MAP[t.tourism] || t.tourism || (t.historic ? '历史遗迹' : '景点');
                    const desc = t.description || '';
                    const addr = t['addr:street'] ? (t['addr:street'] + (t['addr:housenumber'] ? t['addr:housenumber'] + '号' : '')) : '';
                    results.push({
                        name: name,
                        desc: [desc ? desc.substring(0, 60) : '', addr ? `地址：${addr}` : ''].filter(Boolean).join(' · '),
                        tags: [tourismType, t.wikipedia ? '有百科' : ''].filter(Boolean),
                        type: tourismType
                    });
                }
            }
            return results;
        }

        async function fetchFoodAndAttractions(cityName) {
            let bbox = null;
            let searchName = cityName;

            // 先从内置城市库获取 bbox
            const dbCity = matchCity(cityName);
            if (dbCity && dbCity.bbox) bbox = dbCity.bbox;

            // 如果是景区，用景区 bbox
            if (!bbox) {
                const spot = getScenicSpot(cityName);
                if (spot && spot.bbox) {
                    bbox = spot.bbox;
                    searchName = spot.region.split(/省|市|州|自治区/)[0];
                }
            }

            // 如果是省份，用省会
            if (!bbox) {
                const capital = getCapital(cityName);
                if (capital) {
                    const capCity = matchCity(capital);
                    if (capCity && capCity.bbox) {
                        bbox = capCity.bbox;
                        searchName = capital;
                    }
                }
            }

            // 第1步：尝试 Overpass API（有bbox时）
            if (bbox) {
                try {
                    const [food, attractions] = await Promise.all([
                        fetchFromOverpass(bbox, 'food'),
                        fetchFromOverpass(bbox, 'attraction')
                    ]);

                    if (food.length > 0 && attractions.length > 0) {
                        return {
                            food: food.slice(0, 5),
                            attractions: attractions.slice(0, 5),
                            source: 'OpenStreetMap'
                        };
                    }
                    // Overpass 只有一部分数据时，先记住，后面可能要补全
                    if (food.length > 0 || attractions.length > 0) {
                        return {
                            food: food.slice(0, 5),
                            attractions: attractions.slice(0, 5),
                            source: 'OpenStreetMap'
                        };
                    }
                } catch (e) {
                    console.warn('Overpass 查询失败:', e);
                }
            }

            // 第2步：内置数据库
            const fallbackCity = matchCity(cityName) || matchCity(getCapital(cityName) || '');
            if (fallbackCity && fallbackCity.food.length && fallbackCity.attractions.length) {
                return { food: fallbackCity.food, attractions: fallbackCity.attractions, source: '内置数据库' };
            }

            // 第3步：景区兜底
            const spot = getScenicSpot(cityName);
            if (spot) {
                return {
                    food: [],
                    attractions: [{ name: cityName, desc: `${cityName}位于${spot.region}，${spot.desc}。`, tags: ['景区', '自然'] }],
                    source: '景区数据'
                };
            }

            // 第4步：触发网络爬虫，按需抓取
            console.log('📡 本地数据不足，启动网络爬虫...');
            updateLoadingText('正在从网络抓取数据，请稍候...');
            try {
                const scraped = await scrapeFoodAndAttractions(cityName);
                if (scraped.food.length > 0 || scraped.attractions.length > 0) {
                    return scraped;
                }
            } catch (e) {
                console.warn('爬虫抓取失败:', e);
            }

            return { food: [], attractions: [], source: 'none' };
        }

        // ============================================================
        // 渲染函数
        // ============================================================
        function renderWeather(weather) {
            return `
                <div class="weather-card fade-in">
                    <div class="weather-main">
                        <div class="weather-icon">${weather.weatherEmoji}</div>
                        <div class="weather-temp">
                            <span class="temp">${weather.temperature}°C</span>
                            <span class="desc">${weather.weatherText} · ${escapeHtml(weather.city)}</span>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="weather-detail-item"><div class="label">体感温度</div><div class="value">${weather.apparentTemp}°C</div></div>
                        <div class="weather-detail-item"><div class="label">湿度</div><div class="value">${weather.humidity}%</div></div>
                        <div class="weather-detail-item"><div class="label">风速</div><div class="value">${weather.windSpeed} km/h</div></div>
                        <div class="weather-detail-item"><div class="label">风向</div><div class="value">${weather.windDir}</div></div>
                    </div>
                </div>
            `;
        }

        // 当前搜索的城市名（用于空数据跳转）
        var _currentCityName = '';

        function renderItems(items, type) {
            if (!items || items.length === 0) {
                const city = escapeHtml(_currentCityName || '');
                const searchWord = type === 'food' ? `${city} 美食推荐` : `${city} 景点推荐`;
                return `
                    <div class="empty-msg">
                        <p style="margin-bottom:10px;">暂未找到数据</p>
                        <p style="font-size:12px;color:var(--text-light);margin-bottom:12px;">去小红书或抖音搜索更多${type === 'food' ? '美食' : '景点'}信息</p>
                        <div style="display:flex;gap:8px;justify-content:center;">
                            <button onclick="openSearch('xhs', '${escapeHtml(searchWord)}')" class="search-btn xhs" style="padding:8px 16px;font-size:13px;">📕 小红书搜索${type === 'food' ? '美食' : '景点'}</button>
                            <button onclick="openSearch('dy', '${escapeHtml(searchWord)}')" class="search-btn dy" style="padding:8px 16px;font-size:13px;">🎵 抖音搜索${type === 'food' ? '美食' : '景点'}</button>
                        </div>
                    </div>`;
            }
            const tagClass = type === 'food' ? 'amber' : 'green';
            return items.map((item, i) => {
                const typeBadge = type === 'food'
                    ? (item.cuisine ? `<span class="item-type-badge">${escapeHtml(item.cuisine)}</span>` : '')
                    : (item.type ? `<span class="item-type-badge green">${escapeHtml(item.type)}</span>` : '');

                let metaRow = '';
                if (item.addr || item.phone) {
                    const metaParts = [];
                    if (item.addr) metaParts.push(`📍 ${escapeHtml(item.addr)}`);
                    if (item.phone) metaParts.push(`☎ ${escapeHtml(item.phone)}`);
                    metaRow = `<div class="item-meta">${metaParts.map(m => `<span>${m}</span>`).join('')}</div>`;
                }

                const keyword = item.name;

                return `
                    <div class="item-card fade-in" style="animation-delay: ${i * 0.08}s">
                        <div class="item-header">
                            <div class="item-name-wrap">
                                <span class="item-number">${i + 1}</span>
                                <span class="item-name">${escapeHtml(item.name)}</span>
                            </div>
                            ${typeBadge}
                        </div>
                        ${metaRow}
                        ${item.desc ? `<div class="item-desc">${escapeHtml(item.desc)}</div>` : ''}
                        <div class="item-bottom">
                            ${item.tags ? `<div class="item-tags">${item.tags.map(t => `<span class="item-tag ${tagClass}">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
                            <div class="search-links">
                                <button onclick="openSearch('xhs', '${escapeHtml(keyword)}')" class="search-btn xhs" title="在小红书搜索">📕 小红书</button>
                                <button onclick="openSearch('dy', '${escapeHtml(keyword)}')" class="search-btn dy" title="在抖音搜索">🎵 抖音</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderResult(weather, data) {
            const sourceBadge = data.source === 'OpenStreetMap'
                ? '<span class="data-source">🗺️ 数据来源：OpenStreetMap</span>'
                : data.source === '内置数据库'
                    ? '<span class="data-source">💾 数据来源：内置数据库</span>'
                    : data.source === '景区数据'
                        ? '<span class="data-source">🏔️ 数据来源：景区数据</span>'
                        : data.source === '网络抓取'
                            ? '<span class="data-source">🔍 数据来源：网络抓取（百科/搜索）</span>'
                            : '';

            const foodSection = renderItems(data.food, 'food');
            const attractionSection = renderItems(data.attractions, 'attraction');

            document.getElementById('result').innerHTML = `
                <div class="section-title">🌤️ 天气实况</div>
                ${renderWeather(weather)}
                <div class="content-grid">
                    <div class="content-section">
                        <h2>🍲 美食推荐 ${sourceBadge}</h2>
                        ${foodSection}
                    </div>
                    <div class="content-section">
                        <h2>🏞 景点推荐</h2>
                        ${attractionSection}
                    </div>
                </div>
            `;
        }

        function updateLoadingText(msg) {
            const el = document.querySelector('.loading p');
            if (el) el.textContent = msg;
        }

        function renderLoading() {
            document.getElementById('result').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在查询中，请稍候...</p>
                </div>
            `;
        }

        function renderError(msg) {
            document.getElementById('result').innerHTML = `
                <div class="error-msg">
                    <p style="font-size: 48px; margin-bottom: 16px;">😕</p>
                    <p>${escapeHtml(msg)}</p>
                </div>
            `;
        }

        // ============================================================
        // 主搜索逻辑
        // ============================================================
        async function handleSearch() {
            const input = document.getElementById('cityInput');
            const cityName = input.value.trim();
            if (!cityName) { renderError('请输入城市名称'); return; }

            _currentCityName = cityName;
            renderLoading();

            try {
                const [weather, data] = await Promise.all([
                    fetchWeather(cityName),
                    fetchFoodAndAttractions(cityName)
                ]);
                renderResult(weather, data);
                try { localStorage.setItem('lastCity', cityName); } catch (e) {}
            } catch (error) {
                console.error('查询失败:', error);
                const fallbackName = getCapital(cityName) || cityName;
                const dbCity = matchCity(fallbackName);
                if (dbCity) {
                    renderResult(
                        { city: dbCity.city, temperature: '--', weatherText: '获取失败', weatherEmoji: '❓', apparentTemp: '--', humidity: '--', windSpeed: '--', windDir: '--' },
                        { food: dbCity.food, attractions: dbCity.attractions, source: '内置数据库' }
                    );
                } else {
                    const spot = getScenicSpot(cityName);
                    if (spot) {
                        renderResult(
                            { city: cityName, temperature: '--', weatherText: '获取失败', weatherEmoji: '❓', apparentTemp: '--', humidity: '--', windSpeed: '--', windDir: '--' },
                            { food: [], attractions: [{ name: cityName, desc: `${cityName}位于${spot.region}，${spot.desc}。`, tags: ['景区', '自然'] }], source: '景区数据' }
                        );
                    } else {
                        renderError(`无法识别地址「${cityName}」，请输入正确城市名称。`);
                    }
                }
            }
        }

        // ============================================================
        // 初始化
        // ============================================================
        renderQuickCities();
        document.getElementById('cityInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        try {
            const lastCity = localStorage.getItem('lastCity');
            if (lastCity) document.getElementById('cityInput').value = lastCity;
        } catch (e) {}

        // 微信环境检测
        if (isWechat()) {
            const banner = document.createElement('div');
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#FFF3CD;color:#856404;padding:8px 16px;font-size:12px;text-align:center;line-height:1.5;';
            banner.innerHTML = '⚠️ 微信内无法跳转APP，请点击右上角 <strong>···</strong> 选择「在浏览器中打开」';
            document.body.insertBefore(banner, document.body.firstChild);
        }
    </script>
</body>
